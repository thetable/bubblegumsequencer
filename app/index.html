<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubblegum Sequencer</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <h1>Bubblegum Sequencer</h1>
  <div id="link" class="state">connecting</div>
  <button id="mode" class="ghost">Show the pipeline</button>
</header>

<section class="transport">
  <button id="play" class="primary">Play</button>
  <label>Tempo <input id="tempo" type="range" min="50" max="200" value="110">
    <output id="tempoOut">110</output> bpm</label>
  <label>Volume <input id="volume" type="range" min="0" max="100" value="80">
    <output id="volumeOut">80</output></label>
</section>

<section class="board">
  <div id="grid" class="grid" aria-label="the board"></div>
</section>

<section class="voices" id="voices"></section>

<section class="pipeline" id="pipeline" hidden>
  <nav id="steps" class="steps"></nav>
  <figure>
    <img id="shot" alt="">
    <figcaption>
      <h2 id="stageTitle"></h2>
      <p id="stageCaption"></p>
    </figcaption>
  </figure>
  <p class="hint">left and right arrows step through. It is live: move a ball
    and every stage follows.</p>
</section>

<footer>
  <p id="note">waiting for the board</p>
</footer>

<script src="app.js"></script>
</body>
</html>
